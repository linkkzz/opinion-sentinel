name: opinion-sentinel

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: opinion_sentinel
      MYSQL_USER: opinion
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: opinion
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: opinion_sentinel
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      STORAGE_ROOT: /data/storage
      ANALYSIS_POLL_SECONDS: 2
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-600}
      COLLECTION_LOGIN_HEADLESS: ${COLLECTION_LOGIN_HEADLESS:-true}
      COLLECTION_LOGIN_TIMEOUT: ${COLLECTION_LOGIN_TIMEOUT:-180}
      COLLECTION_REQUEST_SLEEP: ${COLLECTION_REQUEST_SLEEP:-2}
      COLLECTION_COOKIE_REFRESH_INTERVAL: ${COLLECTION_COOKIE_REFRESH_INTERVAL:-30}
      COLLECTION_BROWSER_DATA_DIR: /data/browser_data
    volumes:
      - media_data:/data/storage
      - browser_data:/data/browser_data
    depends_on:
      mysql:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  collector:
    build:
      context: .
      dockerfile: backend/collector.Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: opinion
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: opinion_sentinel
      STORAGE_ROOT: /data/storage
      COLLECTION_POLL_SECONDS: ${COLLECTION_POLL_SECONDS:-5}
      COLLECTION_DEFAULT_INTERVAL_SECONDS: ${COLLECTION_DEFAULT_INTERVAL_SECONDS:-300}
      COLLECTION_BATCH_SIZE: ${COLLECTION_BATCH_SIZE:-20}
      COLLECTION_REQUEST_SLEEP: ${COLLECTION_REQUEST_SLEEP:-2}
    volumes:
      - media_data:/data/storage
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy
      collector:
        condition: service_started

volumes:
  mysql_data:
  media_data:
  browser_data:
  ollama_data:
